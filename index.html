<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arealplan101</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" aria-hidden="true"></div>
<header>
  <div class="top">
    <a class="brand" href="#veileder"><span id="mark"></span><h1>Arealplan101</h1></a>
    <button id="tema" class="icon" aria-label="Bytt til mørk modus">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg>
    </button>
  </div>
  <nav id="nav" aria-label="Sider"></nav>
</header>
<main id="veileder">
  <section id="ctrl" aria-label="Scenario">
    <h2>Prosjekt</h2>
    <div class="proj">
      <select id="pvelg" aria-label="Velg prosjekt"></select>
      <div class="pbtn"><button id="pny">Nytt</button><button id="pnavn">Gi nytt navn</button><button id="pslett">Slett</button></div>
    </div>
    <h2>Eksempelscenarioer</h2><div id="eks" class="seg list"></div>
    <h2>Plantype</h2><div id="plan" class="seg stack"></div>
    <h2>Din rolle</h2><div id="akt" class="seg"></div>
    <h2>Formål</h2><div id="formal" class="seg"></div>
    <h2>Stedsforhold</h2><div id="sted" class="seg"></div>
  </section>
  <section id="out" aria-live="polite"></section>
</main>
<article id="guide" hidden></article>
<footer>Veiledende råd. Kontroller alltid mot gjeldende lov, forskrift og kommunens krav. Data v<span id="ver"></span></footer>
<script src="data.js"></script>
<script src="guider.js"></script>
<script src="script.js"></script>
</body>
</html>
